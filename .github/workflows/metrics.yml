name: Profile Metrics

# Renders GitHub stats to assets/*.svg and commits them, so the README
# never depends on a third-party service staying online.

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch:      # lets you run it on demand from the Actions tab

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: HakkanShah
          filename: assets/metrics-dark.svg
          template: classic
          base: header, repositories
          config_timezone: Asia/Kolkata
          config_theme: dark
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          extras_css: |
            body, svg { background: #060D14 !important; }
            h2, .title { color: #38BDF8 !important; }
            .field, section, .row { border-color: #2A5A7D !important; }

      - name: Overview (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: HakkanShah
          filename: assets/metrics-light.svg
          template: classic
          base: header, repositories
          config_timezone: Asia/Kolkata
          config_theme: light
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          extras_css: |
            body, svg { background: #F1F6FA !important; }
            h2, .title { color: #0B6FA4 !important; }
            .field, section, .row { border-color: #8FB0C7 !important; }
