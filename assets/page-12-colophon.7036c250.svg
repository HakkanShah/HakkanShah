<svg xmlns="http://www.w3.org/2000/svg" width="900" height="156" viewBox="0 0 900 156" role="img" aria-label="Approved by the Commits Code Authority - printed in Kolkata">
<title>Approved by the Commits Code Authority - printed in Kolkata</title>
<defs>
<style>@font-face { font-family: "Bangers"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }

@keyframes breathe { 0%, 100% { transform: scale(1); } 48% { transform: scale(1.018); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.40; } 50% { opacity: 0.80; } }
@keyframes drift { to { transform: translate(180px, 180px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.1; } }
@keyframes march { to { transform: translateX(34px); } }
@keyframes glow { 0%, 100% { opacity: 0.30; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.07); } }
@keyframes sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
@keyframes typeline { 0% { transform: scaleX(0); } 22% { transform: scaleX(1); } 78% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
@keyframes btnpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
@keyframes wobble { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(-0.8deg); } }
@keyframes nod { 0%, 100% { transform: rotate(-1.8deg); } 50% { transform: rotate(1.8deg); } }
@keyframes typeL { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes typeR { 0%, 100% { transform: translateY(-6px); } 50% { transform: translateY(0); } }
@keyframes blinkeye { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
@keyframes tilt { 0%, 100% { transform: rotate(-1.3deg); } 50% { transform: rotate(1.3deg); } }
@keyframes pop1 { 0%, 100% { transform: scale(1) rotate(-5deg); } 46% { transform: scale(1.06) rotate(-5deg); } }
@keyframes pop2 { 0%, 100% { transform: scale(1) rotate(4deg); } 46% { transform: scale(1.06) rotate(4deg); } }
@keyframes pop3 { 0%, 100% { transform: scale(1) rotate(-3deg); } 46% { transform: scale(1.06) rotate(-3deg); } }
@keyframes pop4 { 0%, 100% { transform: scale(1) rotate(5deg); } 46% { transform: scale(1.06) rotate(5deg); } }
.bang { font-family: "Bangers", Impact, sans-serif; }
.body { font-family: "ComicNeue", "Trebuchet MS", Verdana, sans-serif; font-weight: 700; }
.breathe { animation: breathe 5.5s ease-in-out infinite; transform-origin: left center; }
.spin { animation: spin 26s linear infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.drift { animation: drift 44s linear infinite; }
.bob { animation: bob 4.6s ease-in-out infinite; }
.bob2 { animation: bob 5.9s ease-in-out infinite; }
.blink { animation: blink 1.4s steps(1, end) infinite; }
.march { animation: march 2.2s linear infinite; }
.glow { animation: glow 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.sway { animation: sway 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
.tl { animation: typeline 4.2s steps(14, end) infinite; transform-box: fill-box; transform-origin: left center; }
.tl2 { animation-delay: 0.5s; }
.tl3 { animation-delay: 1s; }
.btn { animation: btnpulse 2.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.chev { animation: nudge 1.6s ease-in-out infinite; }
.wob { animation: wobble 4.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.eye { animation: blinkeye 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.tilt { animation: tilt 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.nod { animation: nod 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.handL { animation: typeL 0.62s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.handR { animation: typeR 0.62s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.pop1 { animation: pop1 2.4s ease-in-out infinite; }
.pop2 { animation: pop2 2.9s ease-in-out infinite; }
.pop3 { animation: pop3 2.6s ease-in-out infinite; }
.pop4 { animation: pop4 3.1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .breathe, .spin, .pulse, .drift, .bob, .bob2, .blink, .march,
  .pop1, .pop2, .pop3, .pop4, .glow, .sway, .tl, .btn, .chev,
  .wob, .eye, .nod, .tilt { animation: none; }
}
</style>
<pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="2.6" cy="2.6" r="2" fill="#FFFBF0" opacity="0.30"></circle></pattern>
<radialGradient id="heroGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFCB05" stop-opacity="0.60"></stop><stop offset="50%" stop-color="#FFCB05" stop-opacity="0.22"></stop><stop offset="100%" stop-color="#FFCB05" stop-opacity="0"></stop></radialGradient>
<pattern id="pdots" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="translate(0 5)"><circle cx="2.6" cy="2.6" r="2" fill="#141418" opacity="0.07"></circle></pattern>
<clipPath id="cover"><rect x="0" y="52" width="900" height="400"></rect></clipPath>
</defs>
<rect width="900" height="156" fill="#F5ECD8"></rect>
<rect width="900" height="156" fill="url(#pdots)"></rect>
<g transform="translate(0 -5176)"><rect x="36" y="5200" width="828" height="96" fill="#FFFBF0" stroke="#141418" stroke-width="6"></rect><rect x="58" y="5220" width="250" height="56" fill="none" stroke="#141418" stroke-width="4"></rect><text class="bang" x="183" y="5242" font-size="19" letter-spacing="1" fill="#141418" text-anchor="middle">APPROVED BY THE</text><text class="bang" x="183" y="5266" font-size="19" letter-spacing="1" fill="#141418" text-anchor="middle">COMMITS CODE AUTHORITY</text><text class="bang" x="332" y="5258" font-size="23" letter-spacing="2" fill="#6A6252" text-anchor="start">PRINTED IN KOLKATA - ALL BUGS RESERVED</text><rect x="734" y="5228" width="3" height="42" fill="#141418"></rect><rect x="741" y="5228" width="2" height="42" fill="#141418"></rect><rect x="747" y="5228" width="5" height="42" fill="#141418"></rect><rect x="756" y="5228" width="2" height="42" fill="#141418"></rect><rect x="762" y="5228" width="4" height="42" fill="#141418"></rect><rect x="770" y="5228" width="2" height="42" fill="#141418"></rect><rect x="776" y="5228" width="6" height="42" fill="#141418"></rect><rect x="786" y="5228" width="2" height="42" fill="#141418"></rect><rect x="792" y="5228" width="4" height="42" fill="#141418"></rect><rect x="800" y="5228" width="5" height="42" fill="#141418"></rect><rect x="809" y="5228" width="2" height="42" fill="#141418"></rect><rect x="815" y="5228" width="4" height="42" fill="#141418"></rect><rect x="823" y="5228" width="2" height="42" fill="#141418"></rect><rect x="829" y="5228" width="5" height="42" fill="#141418"></rect><rect x="838" y="5228" width="2" height="42" fill="#141418"></rect></g>
<rect x="0" y="0" width="8" height="156" fill="#141418"></rect><rect x="892" y="0" width="8" height="156" fill="#141418"></rect><rect x="0" y="148" width="900" height="8" fill="#141418"></rect>
</svg>
