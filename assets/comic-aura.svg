<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AURA DESKTOP panel &#8212; AUTOMATE!">
<title>AURA DESKTOP &#8212; AUTOMATE!</title>
<defs>
<style>@font-face { font-family: "Bangers"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }

@keyframes pop { 0%, 100% { transform: scale(1) rotate(4deg); } 46% { transform: scale(1.06) rotate(4deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 48% { transform: scale(1.022); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.40; } 50% { opacity: 0.80; } }
@keyframes drift { to { transform: translate(180px, 180px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.1; } }
@keyframes march { to { transform: translateX(44px); } }

.bang { font-family: "Bangers", Impact, "Haettenschweiler", sans-serif; }
.body { font-family: "ComicNeue", "Trebuchet MS", Verdana, sans-serif; font-weight: 700; }
.pop { animation: pop 2.6s ease-in-out infinite; }
.breathe { animation: breathe 5.5s ease-in-out infinite; }
.spin { animation: spin 26s linear infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.drift { animation: drift 44s linear infinite; }
.bob { animation: bob 4.6s ease-in-out infinite; }
.bob2 { animation: bob 5.9s ease-in-out infinite; }
.blink { animation: blink 1.4s steps(1, end) infinite; }
.march { animation: march 2.2s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .pop, .breathe, .spin, .pulse, .drift, .bob, .bob2, .blink, .march { animation: none; }
}
</style><pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="2.6" cy="2.6" r="2" fill="#FFFBF0" opacity="0.22"></circle></pattern><clipPath id="pclip"><rect width="1200" height="300"></rect></clipPath>
</defs>

<rect width="1200" height="300" fill="#E0241B"></rect>
<g clip-path="url(#pclip)">
  <g class="drift"><rect x="-220" y="-220" width="1700" height="900" fill="url(#dots)"></rect></g>
  <path class="pulse" d="M1020 150L1905 311 M1020 150L1776 638 M1020 150L1532 890 M1020 150L1210 1030 M1020 150L859 1035 M1020 150L830 -730 M1020 150L1181 -735 M1020 150L1508 -606 M1020 150L1760 -362 M1020 150L1900 -40" stroke="#FFFBF0" stroke-width="7" fill="none"></path>
</g>
<g transform="translate(56 132)"><g class="pop"><text class="bang" x="12" y="12" font-size="108" letter-spacing="3" fill="#141418">AUTOMATE!</text><text class="bang" x="6" y="6" font-size="108" letter-spacing="3" fill="#141418">AUTOMATE!</text><text class="bang" x="0" y="0" font-size="108" letter-spacing="3" fill="#FFCB05">AUTOMATE!</text></g></g>
<g transform="translate(48 196)">
  <rect x="0" y="0" width="404" height="66" fill="#141418" stroke="#FFFBF0" stroke-width="5"></rect>
  <text class="bang" x="28" y="48" font-size="46" letter-spacing="3" fill="#FFFBF0">AURA DESKTOP</text>
</g>
<g transform="translate(874 36)">
  <rect x="0" y="0" width="290" height="46" fill="#FFCB05" stroke="#141418" stroke-width="4"></rect>
  <text class="bang" x="145" y="34" text-anchor="middle" font-size="30" letter-spacing="2" fill="#141418">IN DEVELOPMENT</text>
</g>
<rect x="4" y="4" width="1192" height="292" fill="none" stroke="#141418" stroke-width="8"></rect>

</svg>
