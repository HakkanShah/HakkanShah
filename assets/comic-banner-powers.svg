<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="124" viewBox="0 0 1200 124" role="img" aria-label="Section heading: KNOWN POWERS">
<title>KNOWN POWERS</title>
<defs>
<style>@font-face { font-family: "Bangers"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }

@keyframes pop { 0%, 100% { transform: scale(1) rotate(0deg); } 46% { transform: scale(1.06) rotate(0deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 48% { transform: scale(1.022); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.40; } 50% { opacity: 0.80; } }
@keyframes drift { to { transform: translate(180px, 180px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.1; } }
@keyframes march { to { transform: translateX(44px); } }

.bang { font-family: "Bangers", Impact, "Haettenschweiler", sans-serif; }
.body { font-family: "ComicNeue", "Trebuchet MS", Verdana, sans-serif; font-weight: 700; }
.pop { animation: pop 2.6s ease-in-out infinite; }
.breathe { animation: breathe 5.5s ease-in-out infinite; }
.spin { animation: spin 26s linear infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.drift { animation: drift 44s linear infinite; }
.bob { animation: bob 4.6s ease-in-out infinite; }
.bob2 { animation: bob 5.9s ease-in-out infinite; }
.blink { animation: blink 1.4s steps(1, end) infinite; }
.march { animation: march 2.2s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .pop, .breathe, .spin, .pulse, .drift, .bob, .bob2, .blink, .march { animation: none; }
}
</style><pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="2.6" cy="2.6" r="2" fill="#141418" opacity="0.12"></circle></pattern><clipPath id="bclip"><rect width="1200" height="124"></rect></clipPath>
</defs>

<rect width="1200" height="124" fill="#FFCB05"></rect>
<g clip-path="url(#bclip)">
  <g class="drift"><rect x="-220" y="-220" width="1700" height="700" fill="url(#dots)"></rect></g>
  <g transform="translate(1092 62)"><g class="spin"><path d="M0.0 -44.0L9.6 -29.5L25.9 -35.6L25.1 -18.2L41.8 -13.6L31.0 0.0L41.8 13.6L25.1 18.2L25.9 35.6L9.6 29.5L0.0 44.0L-9.6 29.5L-25.9 35.6L-25.1 18.2L-41.8 13.6L-31.0 0.0L-41.8 -13.6L-25.1 -18.2L-25.9 -35.6L-9.6 -29.5Z" fill="#FFCB05" stroke="#141418" stroke-width="5" stroke-linejoin="round"></path></g></g>
</g>
<text class="bang" x="44" y="90" font-size="72" letter-spacing="4" fill="#141418">KNOWN POWERS</text>
<rect x="4" y="4" width="1192" height="116" fill="none" stroke="#141418" stroke-width="8"></rect>

</svg>
