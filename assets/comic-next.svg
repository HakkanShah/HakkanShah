<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Next issue teaser banner">
<title>NEXT ISSUE</title>
<defs>
<style>@font-face { font-family: "Bangers"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }

@keyframes pop { 0%, 100% { transform: scale(1) rotate(0deg); } 46% { transform: scale(1.06) rotate(0deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 48% { transform: scale(1.022); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.40; } 50% { opacity: 0.80; } }
@keyframes drift { to { transform: translate(180px, 180px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.1; } }
@keyframes march { to { transform: translateX(44px); } }

.bang { font-family: "Bangers", Impact, "Haettenschweiler", sans-serif; }
.body { font-family: "ComicNeue", "Trebuchet MS", Verdana, sans-serif; font-weight: 700; }
.pop { animation: pop 2.6s ease-in-out infinite; }
.breathe { animation: breathe 5.5s ease-in-out infinite; }
.spin { animation: spin 26s linear infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.drift { animation: drift 44s linear infinite; }
.bob { animation: bob 4.6s ease-in-out infinite; }
.bob2 { animation: bob 5.9s ease-in-out infinite; }
.blink { animation: blink 1.4s steps(1, end) infinite; }
.march { animation: march 2.2s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .pop, .breathe, .spin, .pulse, .drift, .bob, .bob2, .blink, .march { animation: none; }
}
</style><pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="2.6" cy="2.6" r="2" fill="#FFFBF0" opacity="0.14"></circle></pattern><clipPath id="nclip"><rect width="1200" height="170"></rect></clipPath>
</defs>

<rect width="1200" height="170" fill="#141418"></rect>
<g clip-path="url(#nclip)">
  <g class="drift"><rect x="-220" y="-220" width="1700" height="800" fill="url(#dots)"></rect></g>
  <path class="pulse" d="M300 85L1087 228 M300 85L947 556 M300 85L679 790 M300 85L336 884 M300 85L-15 820 M300 85L-303 611 M300 85L-471 297 M300 85L-487 -58 M300 85L-347 -386 M300 85L-79 -620 M300 85L264 -714 M300 85L615 -650 M300 85L903 -441 M300 85L1071 -127" stroke="#1E5FD0" stroke-width="6" fill="none"></path>
</g>
<text class="bang" x="48" y="112" font-size="76" letter-spacing="4" fill="#FFCB05">NEXT ISSUE...</text>
<g class="blink" transform="translate(830 52)">
  <rect x="0" y="0" width="316" height="66" fill="#E0241B" stroke="#FFFBF0" stroke-width="5"></rect>
  <text class="bang" x="158" y="48" text-anchor="middle" font-size="40" letter-spacing="3" fill="#FFFBF0">COMING SOON</text>
</g>
<rect x="4" y="4" width="1192" height="162" fill="none" stroke="#141418" stroke-width="8"></rect>

</svg>
