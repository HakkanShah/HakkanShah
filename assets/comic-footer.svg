<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Comics code stamp and barcode footer">
<title>Colophon</title>
<defs>
<style>@font-face { font-family: "Bangers"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }

@keyframes pop { 0%, 100% { transform: scale(1) rotate(0deg); } 46% { transform: scale(1.06) rotate(0deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 48% { transform: scale(1.022); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.40; } 50% { opacity: 0.80; } }
@keyframes drift { to { transform: translate(180px, 180px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.1; } }
@keyframes march { to { transform: translateX(44px); } }

.bang { font-family: "Bangers", Impact, "Haettenschweiler", sans-serif; }
.body { font-family: "ComicNeue", "Trebuchet MS", Verdana, sans-serif; font-weight: 700; }
.pop { animation: pop 2.6s ease-in-out infinite; }
.breathe { animation: breathe 5.5s ease-in-out infinite; }
.spin { animation: spin 26s linear infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.drift { animation: drift 44s linear infinite; }
.bob { animation: bob 4.6s ease-in-out infinite; }
.bob2 { animation: bob 5.9s ease-in-out infinite; }
.blink { animation: blink 1.4s steps(1, end) infinite; }
.march { animation: march 2.2s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .pop, .breathe, .spin, .pulse, .drift, .bob, .bob2, .blink, .march { animation: none; }
}
</style><pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="2.6" cy="2.6" r="2" fill="#141418" opacity="0.10"></circle></pattern><clipPath id="fclip"><rect width="1200" height="140"></rect></clipPath>
</defs>

<rect width="1200" height="140" fill="#FFFBF0"></rect>
<g clip-path="url(#fclip)"><g class="drift"><rect x="-220" y="-220" width="1700" height="700" fill="url(#dots)"></rect></g></g>
<g transform="translate(40 32)">
  <rect x="0" y="0" width="330" height="76" fill="#FFFBF0" stroke="#141418" stroke-width="5"></rect>
  <text class="bang" x="165" y="32" text-anchor="middle" font-size="24" letter-spacing="1" fill="#141418">APPROVED BY THE</text>
  <text class="bang" x="165" y="62" text-anchor="middle" font-size="24" letter-spacing="1" fill="#141418">COMMITS CODE AUTHORITY</text>
</g>
<text class="bang" x="402" y="80" font-size="30" letter-spacing="2" fill="#6A6252">PRINTED IN KOLKATA - ALL BUGS RESERVED</text>
<g transform="translate(1056 43)"><rect x="0" y="0" width="4" height="54" fill="#141418"></rect><rect x="9" y="0" width="3" height="54" fill="#141418"></rect><rect x="17" y="0" width="6" height="54" fill="#141418"></rect><rect x="28" y="0" width="3" height="54" fill="#141418"></rect><rect x="36" y="0" width="5" height="54" fill="#141418"></rect><rect x="46" y="0" width="3" height="54" fill="#141418"></rect><rect x="54" y="0" width="8" height="54" fill="#141418"></rect><rect x="67" y="0" width="3" height="54" fill="#141418"></rect><rect x="75" y="0" width="5" height="54" fill="#141418"></rect><rect x="85" y="0" width="6" height="54" fill="#141418"></rect><rect x="96" y="0" width="3" height="54" fill="#141418"></rect><rect x="104" y="0" width="5" height="54" fill="#141418"></rect><rect x="114" y="0" width="3" height="54" fill="#141418"></rect><rect x="122" y="0" width="6" height="54" fill="#141418"></rect><rect x="133" y="0" width="3" height="54" fill="#141418"></rect></g>
<rect x="4" y="4" width="1192" height="132" fill="none" stroke="#141418" stroke-width="8"></rect>

</svg>
