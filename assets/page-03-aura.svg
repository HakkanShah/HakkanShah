<svg xmlns="http://www.w3.org/2000/svg" width="900" height="486" viewBox="0 0 900 486" role="img" aria-label="Aura Desktop - AI desktop assistant, in development">
<title>Aura Desktop - AI desktop assistant, in development</title>
<defs>
<style>@font-face { font-family: "Bangers"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
@font-face { font-family: "ComicNeue"; font-style: normal; font-weight: 700; src: url(data:font/woff2;base64,) format("woff2"); }

@keyframes breathe { 0%, 100% { transform: scale(1); } 48% { transform: scale(1.018); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.40; } 50% { opacity: 0.80; } }
@keyframes drift { to { transform: translate(180px, 180px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.1; } }
@keyframes march { to { transform: translateX(34px); } }
@keyframes pop1 { 0%, 100% { transform: scale(1) rotate(-5deg); } 46% { transform: scale(1.06) rotate(-5deg); } }
@keyframes pop2 { 0%, 100% { transform: scale(1) rotate(4deg); } 46% { transform: scale(1.06) rotate(4deg); } }
@keyframes pop3 { 0%, 100% { transform: scale(1) rotate(-3deg); } 46% { transform: scale(1.06) rotate(-3deg); } }
@keyframes pop4 { 0%, 100% { transform: scale(1) rotate(5deg); } 46% { transform: scale(1.06) rotate(5deg); } }
.bang { font-family: "Bangers", Impact, sans-serif; }
.body { font-family: "ComicNeue", "Trebuchet MS", Verdana, sans-serif; font-weight: 700; }
.breathe { animation: breathe 5.5s ease-in-out infinite; transform-origin: left center; }
.spin { animation: spin 26s linear infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.drift { animation: drift 44s linear infinite; }
.bob { animation: bob 4.6s ease-in-out infinite; }
.bob2 { animation: bob 5.9s ease-in-out infinite; }
.blink { animation: blink 1.4s steps(1, end) infinite; }
.march { animation: march 2.2s linear infinite; }
.pop1 { animation: pop1 2.4s ease-in-out infinite; }
.pop2 { animation: pop2 2.9s ease-in-out infinite; }
.pop3 { animation: pop3 2.6s ease-in-out infinite; }
.pop4 { animation: pop4 3.1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .breathe, .spin, .pulse, .drift, .bob, .bob2, .blink, .march,
  .pop1, .pop2, .pop3, .pop4 { animation: none; }
}
</style>
<pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="2.6" cy="2.6" r="2" fill="#FFFBF0" opacity="0.30"></circle></pattern>
<pattern id="pdots" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="translate(0 2)"><circle cx="2.6" cy="2.6" r="2" fill="#141418" opacity="0.07"></circle></pattern>
<clipPath id="cover"><rect x="0" y="52" width="900" height="400"></rect></clipPath>
</defs>
<rect width="900" height="486" fill="#F5ECD8"></rect>
<rect width="900" height="486" fill="url(#pdots)"></rect>
<g transform="translate(0 -1758)"><clipPath id="clipAURADESKTOP"><rect x="36" y="1758" width="828" height="212"></rect></clipPath><rect x="36" y="1758" width="828" height="212" fill="#E0241B"></rect><g clip-path="url(#clipAURADESKTOP)"><path class="pulse" d="M770 1858L1459 1983 M770 1858L1358 2237 M770 1858L1168 2434 M770 1858L918 2542 M770 1858L645 2547 M770 1858L622 1174 M770 1858L895 1169 M770 1858L1149 1270 M770 1858L1346 1460 M770 1858L1454 1710" stroke="#FFFBF0" stroke-width="6" fill="none"></path></g><rect x="36" y="1758" width="828" height="212" fill="none" stroke="#141418" stroke-width="6"></rect><g transform="translate(70 1858)"><g class="pop2"><text class="bang" x="10" y="10" font-size="76" letter-spacing="3" fill="#141418">AUTOMATE!</text><text class="bang" x="5" y="5" font-size="76" letter-spacing="3" fill="#141418">AUTOMATE!</text><text class="bang" x="0" y="0" font-size="76" letter-spacing="3" fill="#FFCB05">AUTOMATE!</text></g></g><rect x="66" y="1892" width="232" height="50" fill="#141418" stroke="#FFFBF0" stroke-width="4"></rect><text class="bang" x="88" y="1927" font-size="32" letter-spacing="3" fill="#FFFBF0" text-anchor="start">AURA DESKTOP</text><rect x="663" y="1784" width="171" height="38" fill="#FFCB05" stroke="#141418" stroke-width="4"></rect><text class="bang" x="748.711" y="1811" font-size="22" letter-spacing="2" fill="#141418" text-anchor="middle">IN DEVELOPMENT</text><text class="body" x="44" y="2020.24" font-size="29" fill="#141418" text-anchor="start">A desktop AI assistant that can actually press the buttons. Voice</text><text class="body" x="44" y="2062.24" font-size="29" fill="#141418" text-anchor="start">interaction in, desktop and browser automation out, several LLM</text><text class="body" x="44" y="2104.24" font-size="29" fill="#141418" text-anchor="start">providers behind a single door so the model is a choice rather</text><text class="body" x="44" y="2146.24" font-size="29" fill="#141418" text-anchor="start">than a dependency.</text><rect x="44" y="2172" width="108" height="38" fill="none" stroke="#141418" stroke-width="3"></rect><text class="body" x="98.1815" y="2199" font-size="23" fill="#141418" text-anchor="middle">Electron</text><rect x="162" y="2172" width="96" height="38" fill="none" stroke="#141418" stroke-width="3"></rect><text class="body" x="210.4265" y="2199" font-size="23" fill="#141418" text-anchor="middle">Node.js</text><rect x="268" y="2172" width="78" height="38" fill="none" stroke="#141418" stroke-width="3"></rect><text class="body" x="307.4685" y="2199" font-size="23" fill="#141418" text-anchor="middle">Voice</text><rect x="356" y="2172" width="127" height="38" fill="none" stroke="#141418" stroke-width="3"></rect><text class="body" x="419.725" y="2199" font-size="23" fill="#141418" text-anchor="middle">Multi-LLM</text></g>
<rect x="0" y="0" width="8" height="486" fill="#141418"></rect><rect x="892" y="0" width="8" height="486" fill="#141418"></rect>
</svg>
