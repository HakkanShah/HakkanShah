<svg xmlns="http://www.w3.org/2000/svg" width="900" height="444" viewBox="0 0 900 444" role="img" aria-label="Portfolio - a terminal-driven portfolio">
<title>Portfolio - a terminal-driven portfolio</title>
<defs>
<style>@font-face { font-family: "Bangers"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
@font-face { font-family: "ComicNeue"; font-style: normal; font-weight: 700; src: url(data:font/woff2;base64,) format("woff2"); }

@keyframes breathe { 0%, 100% { transform: scale(1); } 48% { transform: scale(1.018); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.40; } 50% { opacity: 0.80; } }
@keyframes drift { to { transform: translate(180px, 180px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.1; } }
@keyframes march { to { transform: translateX(34px); } }
@keyframes pop1 { 0%, 100% { transform: scale(1) rotate(-5deg); } 46% { transform: scale(1.06) rotate(-5deg); } }
@keyframes pop2 { 0%, 100% { transform: scale(1) rotate(4deg); } 46% { transform: scale(1.06) rotate(4deg); } }
@keyframes pop3 { 0%, 100% { transform: scale(1) rotate(-3deg); } 46% { transform: scale(1.06) rotate(-3deg); } }
@keyframes pop4 { 0%, 100% { transform: scale(1) rotate(5deg); } 46% { transform: scale(1.06) rotate(5deg); } }
.bang { font-family: "Bangers", Impact, sans-serif; }
.body { font-family: "ComicNeue", "Trebuchet MS", Verdana, sans-serif; font-weight: 700; }
.breathe { animation: breathe 5.5s ease-in-out infinite; transform-origin: left center; }
.spin { animation: spin 26s linear infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.drift { animation: drift 44s linear infinite; }
.bob { animation: bob 4.6s ease-in-out infinite; }
.bob2 { animation: bob 5.9s ease-in-out infinite; }
.blink { animation: blink 1.4s steps(1, end) infinite; }
.march { animation: march 2.2s linear infinite; }
.pop1 { animation: pop1 2.4s ease-in-out infinite; }
.pop2 { animation: pop2 2.9s ease-in-out infinite; }
.pop3 { animation: pop3 2.6s ease-in-out infinite; }
.pop4 { animation: pop4 3.1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .breathe, .spin, .pulse, .drift, .bob, .bob2, .blink, .march,
  .pop1, .pop2, .pop3, .pop4 { animation: none; }
}
</style>
<pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="2.6" cy="2.6" r="2" fill="#FFFBF0" opacity="0.30"></circle></pattern>
<pattern id="pdots" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)"><circle cx="2.6" cy="2.6" r="2" fill="#141418" opacity="0.07"></circle></pattern>
<clipPath id="cover"><rect x="0" y="52" width="900" height="400"></rect></clipPath>
</defs>
<rect width="900" height="444" fill="#F5ECD8"></rect>
<rect width="900" height="444" fill="url(#pdots)"></rect>
<g transform="translate(0 -2244)"><clipPath id="clipPORTFOLIO"><rect x="36" y="2244" width="828" height="212"></rect></clipPath><rect x="36" y="2244" width="828" height="212" fill="#FFCB05"></rect><g clip-path="url(#clipPORTFOLIO)"><g class="pulse" fill="none" stroke="#141418" stroke-width="6" opacity="0.40"><circle cx="748" cy="2348" r="34"></circle><circle cx="748" cy="2348" r="72"></circle><circle cx="748" cy="2348" r="110"></circle><circle cx="748" cy="2348" r="148"></circle><circle cx="748" cy="2348" r="186"></circle></g></g><rect x="36" y="2244" width="828" height="212" fill="none" stroke="#141418" stroke-width="6"></rect><g transform="translate(70 2344)"><g class="pop3"><text class="bang" x="10" y="10" font-size="76" letter-spacing="3" fill="#141418">TYPE!</text><text class="bang" x="5" y="5" font-size="76" letter-spacing="3" fill="#FFFBF0">TYPE!</text><text class="bang" x="0" y="0" font-size="76" letter-spacing="3" fill="#E0241B">TYPE!</text></g></g><rect x="66" y="2378" width="180" height="50" fill="#141418" stroke="#FFFBF0" stroke-width="4"></rect><text class="bang" x="88" y="2413" font-size="32" letter-spacing="3" fill="#FFFBF0" text-anchor="start">PORTFOLIO</text><rect x="676" y="2270" width="158" height="38" fill="#FFCB05" stroke="#141418" stroke-width="4"></rect><text class="bang" x="754.826" y="2297" font-size="22" letter-spacing="2" fill="#141418" text-anchor="middle">FAN FAVOURITE</text><text class="body" x="44" y="2506.24" font-size="29" fill="#141418" text-anchor="start">A portfolio you drive from a command line. Built on the</text><text class="body" x="44" y="2548.24" font-size="29" fill="#141418" text-anchor="start">suspicion that a portfolio should ask something of the person</text><text class="body" x="44" y="2590.24" font-size="29" fill="#141418" text-anchor="start">reading it.</text><rect x="44" y="2616" width="81" height="38" fill="none" stroke="#141418" stroke-width="3"></rect><text class="body" x="84.37" y="2643" font-size="23" fill="#141418" text-anchor="middle">React</text><rect x="135" y="2616" width="145" height="38" fill="none" stroke="#141418" stroke-width="3"></rect><text class="body" x="207.241" y="2643" font-size="23" fill="#141418" text-anchor="middle">Terminal UI</text><rect x="290" y="2616" width="86" height="38" fill="none" stroke="#141418" stroke-width="3"></rect><text class="body" x="332.9755" y="2643" font-size="23" fill="#141418" text-anchor="middle">Vercel</text><rect x="386" y="2614" width="253" height="42" fill="#E0241B" stroke="#141418" stroke-width="3"></rect><text class="bang" x="512.645" y="2644" font-size="24" letter-spacing="2" fill="#FFFBF0" text-anchor="middle">VISIT HAKKAN.IS-A.DEV</text></g>
<rect x="0" y="0" width="8" height="444" fill="#141418"></rect><rect x="892" y="0" width="8" height="444" fill="#141418"></rect>
</svg>
